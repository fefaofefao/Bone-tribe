name: Android AAB e APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Godot e templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Baixar Godot e templates de exportação
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q "Godot_v${V}_linux.x86_64.zip"
          mv "Godot_v${V}_linux.x86_64" godot
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q "Godot_v${V}_export_templates.tpz"
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          rm -f *.zip *.tpz

      - name: Configurar Godot (SDK Android e Java)
        run: |
          set -e
          echo "$HOME/godot" >> $GITHUB_PATH
          mkdir -p ~/.config/godot
          MINOR=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          cat > ~/.config/godot/editor_settings-${MINOR}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-${MINOR}.tres
          cat ~/.config/godot/editor_settings-${MINOR}.tres

      - name: Keystores (debug gerada; release vem dos secrets ou é temporária)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_USER }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p ~/keys
          keytool -genkeypair -v -keystore ~/keys/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ~/keys/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RELEASE_KEYSTORE_USER" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          else
            echo "::warning::Sem keystore de release nos secrets; assinando com uma chave temporária (não envie esse AAB para a Play Store)."
            keytool -genkeypair -v -keystore ~/keys/release.keystore -storepass bonetribe -alias bonetribe \
              -keypass bonetribe -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bone Tribe CI,O=Bone Tribe,C=BR"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=bonetribe" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=bonetribe" >> $GITHUB_ENV
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/keys/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/keys/release.keystore" >> $GITHUB_ENV

      - name: Versão do app (versionCode = número da execução)
        run: |
          set -e
          NAME=$(grep -oP '^config/version="\K[^"]+' project.godot)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; fi
          CODE=$((GITHUB_RUN_NUMBER + 100))
          sed -i "s/^version\/code=.*/version\/code=$CODE/; s/^version\/name=.*/version\/name=\"$NAME\"/" export_presets.cfg
          echo "versionName=$NAME versionCode=$CODE"
          grep -n "^version/" export_presets.cfg

      - name: Plugin Google Play Billing (AARs do release oficial)
        env:
          GH_TOKEN: ${{ github.token }}
          BILLING_VERSION: "3.3.0"
        run: |
          set -e
          mkdir -p /tmp/billing addons/GodotGooglePlayBilling/bin/debug addons/GodotGooglePlayBilling/bin/release
          gh release download "$BILLING_VERSION" -R godot-sdk-integrations/godot-google-play-billing -p '*.zip' -D /tmp/billing
          cd /tmp/billing && for z in *.zip; do unzip -o -q "$z"; done && cd -
          cp "$(find /tmp/billing -name 'GodotGooglePlayBilling-debug.aar' | head -1)" addons/GodotGooglePlayBilling/bin/debug/
          cp "$(find /tmp/billing -name 'GodotGooglePlayBilling-release.aar' | head -1)" addons/GodotGooglePlayBilling/bin/release/
          ls -la addons/GodotGooglePlayBilling/bin/*

      - name: IDs do AdMob (variáveis do repositório; sem elas ficam os IDs de teste)
        env:
          # `vars.X || secrets.X` passa pela expressão do Actions e pode alterar a barra
          # dos IDs de bloco. Cada origem entra direto; o shell escolhe variável ou secret.
          ADMOB_APP_ID_VAR: ${{ vars.ADMOB_APP_ID }}
          ADMOB_APP_ID_SECRET: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID_VAR: ${{ vars.ADMOB_REWARDED_ID }}
          ADMOB_REWARDED_ID_SECRET: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID_VAR: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          ADMOB_INTERSTITIAL_ID_SECRET: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          export ADMOB_APP_ID="${ADMOB_APP_ID_VAR:-$ADMOB_APP_ID_SECRET}"
          export ADMOB_REWARDED_ID="${ADMOB_REWARDED_ID_VAR:-$ADMOB_REWARDED_ID_SECRET}"
          export ADMOB_INTERSTITIAL_ID="${ADMOB_INTERSTITIAL_ID_VAR:-$ADMOB_INTERSTITIAL_ID_SECRET}"
          python3 tools/admob_ids.py

      - name: Firebase (google-services.json do secret; sem ele o build sai sem Firebase)
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > addons/bonetribe_firebase/google-services.json
            python3 -c "import json,sys; d=json.load(open('addons/bonetribe_firebase/google-services.json')); pk=[c['client_info']['android_client_info']['package_name'] for c in d['client']]; assert 'com.fsamplabs.bone_tribe' in pk, pk; print('Firebase: projeto', d['project_info']['project_id'])"
          else
            echo "::warning::Sem o secret FIREBASE_GOOGLE_SERVICES_JSON: o build sai sem Firebase (eventos ficam só no aparelho)."
          fi

      - name: Importar recursos (baixa também os binários Android do AdMob)
        run: |
          # 1ª passada instala os binários do AdMob e pode reiniciar o editor;
          # a 2ª garante que todos os recursos foram importados
          # o Godot às vezes cai (segfault) no meio da importação; repete até 4 vezes
          for i in 1 2 3 4; do
            godot --headless --import --path . || echo "::warning::importação $i terminou com erro"
            N=$(ls .godot/imported 2>/dev/null | wc -l)
            echo "passada $i: $N recursos importados"
            if [ "$i" -ge 2 ] && [ "$N" -gt 300 ]; then break; fi
          done
          N=$(ls .godot/imported | wc -l)
          echo "recursos importados: $N"
          test "$N" -gt 300
          test -f addons/admob/android/bin/ads/poing_godot_admob_ads.gd
          grep -n "app_id" project.godot || echo "AdMob: usando o ID de app de teste"

      - name: Testes automáticos
        run: godot --headless --path . res://tests/TestRunner.tscn

      - name: Exportar AAB
        run: |
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-release "Android" build/BoneTribe.aab
          ls -la build
          test -s build/BoneTribe.aab

      - name: Exportar APK de teste
        run: |
          godot --headless --path . --export-release "Android APK" build/BoneTribe.apk
          ls -la build
          test -s build/BoneTribe.apk

      - name: Verificar APK (instalável no celular)
        run: |
          set -x
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/aapt2" dump badging build/BoneTribe.apk | grep -iE "package:|sdkVersion|native-code" || true
          unzip -l build/BoneTribe.apk | grep -E "AndroidManifest|resources.arsc|classes.dex|\.so$" | head -20 || true
          "$BT/zipalign" -c -P 16 4 build/BoneTribe.apk && echo "zipalign OK" || echo "::warning::APK não alinhado"
          "$BT/apksigner" verify --verbose --print-certs build/BoneTribe.apk

      # Sem o secret, compila uma vez com uma configuração de exemplo só para
      # garantir que a integração do Firebase continua compilando.
      - name: Checar integração Firebase (configuração de exemplo, não publicada)
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            echo "Firebase real já está no build principal."
          else
            cp tools/firebase_config_exemplo.json addons/bonetribe_firebase/google-services.json
            godot --headless --path . --export-release "Android APK" /tmp/firebase_check.apk
            rm addons/bonetribe_firebase/google-services.json
            test -s /tmp/firebase_check.apk
          fi
          APK=build/BoneTribe.apk
          [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ] || APK=/tmp/firebase_check.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q "com.bonetribe.firebase.BoneTribeFirebase"
          echo "Plugin BoneTribeFirebase registrado no manifesto."

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: BoneTribe-aab
          path: build/BoneTribe.aab
          if-no-files-found: error

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BoneTribe-apk
          path: build/BoneTribe.apk
          if-no-files-found: error

      # APK direto (sem .zip) para instalar no celular: a página "APK de teste"
      # é atualizada a cada build. O instalador do Android não abre APK de dentro de .zip.
      - name: Publicar APK de teste (arquivo direto)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-teste
          name: "APK de teste (última versão)"
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            APK de teste gerado automaticamente a partir do commit ${{ github.sha }} (execução ${{ github.run_number }}).
            No celular: toque em BoneTribe.apk para baixar e depois abra o arquivo baixado.
          files: build/BoneTribe.apk

      - name: Publicar Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/BoneTribe.aab
            build/BoneTribe.apk
          generate_release_notes: true
