name: Android AAB e APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Godot e templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Baixar Godot e templates de exportação
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q "Godot_v${V}_linux.x86_64.zip"
          mv "Godot_v${V}_linux.x86_64" godot
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q "Godot_v${V}_export_templates.tpz"
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          rm -f *.zip *.tpz

      - name: Configurar Godot (SDK Android e Java)
        run: |
          set -e
          echo "$HOME/godot" >> $GITHUB_PATH
          mkdir -p ~/.config/godot
          MINOR=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          cat > ~/.config/godot/editor_settings-${MINOR}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-${MINOR}.tres
          cat ~/.config/godot/editor_settings-${MINOR}.tres

      - name: Keystores (debug gerada; release vem dos secrets ou é temporária)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_USER }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p ~/keys
          keytool -genkeypair -v -keystore ~/keys/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ~/keys/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RELEASE_KEYSTORE_USER" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          else
            echo "::warning::Sem keystore de release nos secrets; assinando com uma chave temporária (não envie esse AAB para a Play Store)."
            keytool -genkeypair -v -keystore ~/keys/release.keystore -storepass bonetribe -alias bonetribe \
              -keypass bonetribe -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bone Tribe CI,O=Bone Tribe,C=BR"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=bonetribe" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=bonetribe" >> $GITHUB_ENV
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/keys/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/keys/release.keystore" >> $GITHUB_ENV

      - name: Versão do app (versionCode = número da execução)
        run: |
          set -e
          NAME=$(grep -oP '^config/version="\K[^"]+' project.godot)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; fi
          CODE=$((GITHUB_RUN_NUMBER + 100))
          sed -i "s/^version\/code=.*/version\/code=$CODE/; s/^version\/name=.*/version\/name=\"$NAME\"/" export_presets.cfg
          echo "versionName=$NAME versionCode=$CODE"
          grep -n "^version/" export_presets.cfg

      - name: Importar recursos
        run: godot --headless --import --path . || true

      - name: Testes automáticos
        run: godot --headless --path . res://tests/TestRunner.tscn

      - name: Exportar AAB
        run: |
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-release "Android" build/BoneTribe.aab
          ls -la build
          test -s build/BoneTribe.aab

      - name: Exportar APK de teste
        run: |
          godot --headless --path . --export-release "Android APK" build/BoneTribe.apk
          ls -la build
          test -s build/BoneTribe.apk

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: BoneTribe-aab
          path: build/BoneTribe.aab
          if-no-files-found: error

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BoneTribe-apk
          path: build/BoneTribe.apk
          if-no-files-found: error

      - name: Publicar Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/BoneTribe.aab
            build/BoneTribe.apk
          generate_release_notes: true
